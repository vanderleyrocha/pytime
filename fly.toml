# Worker de geração do PyTime — processo sempre ligado, sem serviço HTTP.
# Fica na raiz do repo: o contexto do build precisa enxergar engine/ e worker/.
# Deploy (da raiz): fly deploy --remote-only
app = "pytime-worker"
primary_region = "gru"

[build]
  dockerfile = "worker/Dockerfile"

[processes]
  worker = "python -m pytime_worker.principal"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["worker"]

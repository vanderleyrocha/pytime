# App do PyTime no Fly com dois processos:
# - worker: loop da fila de gerações, sem serviço HTTP;
# - validador: POST /avaliar da edição manual (chamado só pelo servidor
#   Next.js, com Authorization: Bearer $VALIDADOR_TOKEN).
# Fica na raiz do repo: o contexto do build precisa enxergar engine/ e worker/.
# Deploy (da raiz): fly deploy --remote-only
app = "pytime-worker"
primary_region = "gru"

[build]
  dockerfile = "worker/Dockerfile"

[processes]
  worker = "python -m pytime_worker.principal"
  validador = "python -m pytime_worker.validador"

[env]
  PORT = "8080"

# Só o validador recebe tráfego. Sempre ligado: o cache de modelos
# preparados (≈75 MB por instância de 80 turmas) se perde ao parar.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["validador"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/saude"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["validador"]

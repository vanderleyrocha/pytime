[project]
name = "pytime-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ortools>=9.10", "pydantic>=2.7"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle; F: pyflakes; I: isort; UP: modernização; B: bugbear
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# OR-Tools não publica stubs completos para a API python do CP-SAT.
module = "ortools.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["pytime_engine"]

[tool.coverage.report]
show_missing = true

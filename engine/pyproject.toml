[project]
name = "pytime-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ortools>=9.10", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI do PyTime: motor, app e worker em todo push e pull request.
# Testes que dependem de banco (worker + RLS) só rodam se o secret
# SUPABASE_DB_URL_STAGING existir — NUNCA aponte para o banco de produção:
# os testes do worker reivindicam a geração pendente mais antiga.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Motor (engine/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -q

  app:
    name: App (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run teste
      - run: npm run lint
      - run: npm run build

  worker:
    name: Worker (worker/)
    runs-on: ubuntu-latest
    # um job por vez no banco de staging: os testes reivindicam a geração
    # pendente mais antiga, e duas execuções paralelas roubariam o job uma da outra
    concurrency:
      group: banco-staging
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            worker/pyproject.toml
      - run: pip install ./engine -e "./worker[dev]"
      - working-directory: worker
        run: ruff check . && ruff format --check .
      # o staging recebe as migrations do branch antes dos testes de banco
      # (só aplica as que ainda não estão no histórico do banco)
      - name: Migrations no staging
        if: env.SUPABASE_DB_URL != ''
        run: npx --yes supabase@latest db push --db-url "$SUPABASE_DB_URL" --yes
      # sem o secret, os testes de banco são pulados (skip) pelo conftest
      - working-directory: worker
        run: python -m pytest -q
      - name: Testes de RLS (pgTAP)
        if: env.SUPABASE_DB_URL != ''
        run: python supabase/tests/rodar_testes.py

  staging-chaves:
    name: Staging (chaves da API)
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL_STAGING }}
      ANON: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
      SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
    steps:
      # confere os secrets do E2E sem expor valores: a chave pública precisa
      # ser aceita pela API REST e a de serviço precisa listar usuários do Auth
      - name: Conferir chaves do staging
        if: env.URL != ''
        run: |
          set -e
          # tolera espaço, quebra de linha e barra final coladas no secret
          URL=$(printf '%s' "$URL" | tr -d '[:space:]'); URL=${URL%/}
          ANON=$(printf '%s' "$ANON" | tr -d '[:space:]')
          SERVICE=$(printf '%s' "$SERVICE" | tr -d '[:space:]')
          case "$URL" in
            https://*.supabase.co) ;;
            *)
              # diagnóstico sem revelar o valor
              echo "SUPABASE_URL_STAGING fora do formato https://<ref>.supabase.co:"
              case "$URL" in https://*) echo "- começa com https://: sim" ;; *) echo "- começa com https://: NÃO" ;; esac
              case "$URL" in *supabase.co*) echo "- contém supabase.co: sim" ;; *) echo "- contém supabase.co: NÃO" ;; esac
              case "$URL" in *postgres*) echo "- parece string de conexão do banco (postgres...), não a Project URL" ;; esac
              case "$URL" in *sb_*|eyJ*) echo "- parece uma CHAVE, não a URL (secrets trocados?)" ;; esac
              echo "- tamanho: ${#URL} caracteres (o esperado é 40)"
              exit 1 ;;
          esac
          # chaves novas (sb_publishable_/sb_secret_) vão só no apikey; as
          # antigas (JWT) também no Authorization: tenta os dois formatos
          status() {
            c=$(curl -s -o /dev/null -w '%{http_code}' "$1" -H "apikey: $2")
            if [ "$c" != 200 ]; then
              c=$(curl -s -o /dev/null -w '%{http_code}' "$1" -H "apikey: $2" -H "Authorization: Bearer $2")
            fi
            echo "$c"
          }
          publica=$(status "$URL/rest/v1/turnos?select=id&limit=1" "$ANON")
          echo "chave pública na API REST: HTTP $publica"; test "$publica" = 200
          servico=$(status "$URL/auth/v1/admin/users?per_page=1" "$SERVICE")
          echo "chave de serviço no admin do Auth: HTTP $servico"; test "$servico" = 200
          recusa=$(status "$URL/auth/v1/admin/users?per_page=1" "$ANON")
          echo "chave pública no admin do Auth (deve recusar): HTTP $recusa"; test "$recusa" != 200
